<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Precios de productos | Fitosanidad</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<style>
:root{--bg:#f6f7f8;--card:#fff;--ink:#16202a;--mut:#667381;--line:#e3e6ea;--soft:#f2f4f5;--acc:#1f6b45;--accbg:#e8f3ec}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.5 'IBM Plex Sans',system-ui,sans-serif;font-variant-numeric:tabular-nums}
header{background:#fff;border-bottom:1px solid var(--line)}
.top{max-width:1120px;margin:0 auto;padding:22px 20px;display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}
h1{font:700 26px/1.15 'IBM Plex Sans',sans-serif;margin:0;letter-spacing:-.01em}
.sub{color:var(--mut);margin:2px 0 0;font-size:14px}
.btn{font:600 14px 'IBM Plex Sans',sans-serif;border:0;border-radius:10px;padding:11px 18px;cursor:pointer;background:var(--acc);color:#fff}
.btn:hover{background:#185738}
.btn.ghost{background:#fff;color:var(--ink);border:1px solid var(--line)}
.btn:focus-visible,.card:focus-visible,.chip:focus-visible,.x:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #8cc7a5;outline-offset:2px}
main{max-width:1120px;margin:0 auto;padding:20px 20px 60px}
.bar{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin-bottom:6px}
.bar input{flex:1;min-width:240px;font:400 16px 'IBM Plex Sans',sans-serif;padding:13px 16px;border-radius:12px;border:1px solid var(--line);background:#fff;color:var(--ink)}
.bar input:focus{border-color:var(--acc)}
.chips{display:flex;gap:6px}
.chip{font:500 14px 'IBM Plex Sans',sans-serif;padding:9px 14px;border-radius:999px;border:1px solid var(--line);background:#fff;color:var(--mut);cursor:pointer}
.chip[aria-pressed=true]{background:var(--ink);color:#fff;border-color:var(--ink)}
.meta{display:flex;justify-content:space-between;color:var(--mut);font-size:13px;margin:10px 2px 14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;text-align:left;cursor:pointer;color:inherit;font:inherit;display:flex;flex-direction:column;gap:2px;transition:border-color .15s,box-shadow .15s}
.card:hover{border-color:#b9c3cc;box-shadow:0 4px 14px rgba(22,32,42,.06)}
.badge{display:flex;gap:6px;font-size:12px;font-weight:600;color:var(--mut);margin-bottom:6px}
.badge i{font-style:normal;padding:2px 8px;border-radius:6px;background:var(--soft)}
.badge i.new{background:var(--accbg);color:var(--acc)}
.card h3{font:700 17px/1.25 'IBM Plex Sans',sans-serif;margin:0}
.ia{color:var(--mut);font-size:13.5px;min-height:20px;margin-bottom:12px}
.mx{display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid var(--line);margin-top:auto}
.mx div{padding:10px 0 0}
.mx small{display:block;color:var(--mut);font-size:12px}
.mx b{font-weight:600;font-size:15px}
.cost{display:flex;justify-content:space-between;align-items:baseline;margin-top:12px;padding:10px 12px;background:var(--accbg);border-radius:10px}
.cost small{color:var(--acc);font-weight:600;font-size:13px}
.cost b{font-size:20px;font-weight:700;color:var(--acc)}
.empty{grid-column:1/-1;padding:48px;text-align:center;color:var(--mut)}
dialog{border:0;border-radius:18px;padding:0;max-width:540px;width:calc(100% - 24px);background:#fff;color:var(--ink);box-shadow:0 24px 70px rgba(10,20,30,.3)}
dialog::backdrop{background:rgba(15,22,30,.5)}
.dl{padding:24px}
.x{float:right;border:0;background:var(--soft);color:var(--ink);width:34px;height:34px;border-radius:50%;font-size:20px;cursor:pointer}
dl{display:grid;grid-template-columns:1fr auto;margin:14px 0}
dt,dd{margin:0;padding:9px 0;border-bottom:1px solid var(--line)}
dt{color:var(--mut)} dd{text-align:right;font-weight:600;max-width:300px;margin-left:auto}
.sim{background:var(--soft);border-radius:14px;padding:16px;margin-top:8px}
.sim h4{margin:0 0 10px;font:700 15px 'IBM Plex Sans',sans-serif}
.inp{display:flex;gap:10px}
label{flex:1;font-size:13px;color:var(--mut);display:block;margin-bottom:10px}
label input,label select{width:100%;margin-top:4px;font:500 16px 'IBM Plex Sans',sans-serif;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:#fff;color:var(--ink)}
.res{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:4px}
.res div{background:#fff;border:1px solid var(--line);border-radius:10px;padding:8px 12px}
.res small{display:block;color:var(--mut);font-size:12px}
.res b{font-size:20px;font-weight:700}
.res .c{background:var(--accbg);border-color:transparent}.res .c b,.res .c small{color:var(--acc)}
.note{font-size:12px;color:var(--mut);margin-top:10px}
.msg{padding:10px 14px;border-radius:10px;margin-bottom:14px;font-size:13.5px;background:#fff7e0;color:#6a4b00}
.msg.ok{background:var(--accbg);color:var(--acc)}
.acts{display:flex;gap:10px;justify-content:flex-end;margin-top:14px}
.err{color:#b3261e;font-size:13px;min-height:18px}
</style>
</head>

const norm = s => String(s||"").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").trim();
const num = v => { if(typeof v==="number")return v; const n=parseFloat(String(v||"").replace(/[^\d.,-]/g,"").replace(",",".")); return isNaN(n)?0:n; };
const fmt = (n,d=2) => n.toLocaleString("es-PE",{minimumFractionDigits:d,maximumFractionDigits:d});
const money = n => MONEDA+" "+fmt(n);
const esc = s => String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const $ = id => document.getElementById(id);

const ALIAS={codigo_sap:["codigo_sap","codigo","sap"],proveedor:["proveedor"],tipo_producto:["tipo_producto","tipo_de_producto"],
 producto:["producto","descripcion","nombre","nombre_comercial"],ingrediente_activo:["ingrediente_activo","ia"],
 dosis_cil:["dosis_cil","dosis_por_cil"],volumen:["volumen","volumen_usado"],dosis_ha:["dosis_ha","dosis_por_ha"],
 precio_litro:["precio_litro","costo_por_litro","precio_por_litro"],activo:["activo"]};

function parseCSV(t){const rows=[];let r=[],c="",q=false;
  for(let i=0;i<t.length;i++){const ch=t[i];
    if(q){if(ch=='"'){if(t[i+1]=='"'){c+='"';i++}else q=false}else c+=ch}
    else if(ch=='"')q=true;else if(ch==","){r.push(c);c=""}
    else if(ch=="\n"||ch=="\r"){if(ch=="\r"&&t[i+1]=="\n")i++;r.push(c);c="";rows.push(r);r=[]}else c+=ch}
  if(c||r.length){r.push(c);rows.push(r)}return rows.filter(x=>x.some(v=>v.trim()))}
function toObjects(rows){
  const head=rows[0].map(h=>norm(h).replace(/[^a-z0-9]+/g,"_").replace(/^_|_$/g,""));
  const idx={};for(const k in ALIAS)idx[k]=head.findIndex(h=>ALIAS[k].includes(h));
  return rows.slice(1).map(r=>{const o={};for(const k in idx)o[k]=idx[k]>=0?(r[idx[k]]||"").trim():"";return o})}

/* Regla: si hay dosis/cil → dosis/ha = dosis/cil × volumen ÷ 200. Si no, se usa la dosis/ha de etiqueta. */
const haDe = (cil,vol) => cil*vol/CIL;
function build(o,nuevo){
  const cil=num(o.dosis_cil), vol=num(o.volumen)||1000, precio=num(o.precio_litro);
  const base = cil>0 ? "CIL" : "HA";
  const ha = base==="CIL" ? haDe(cil,vol) : num(o.dosis_ha);
  return {...o,base,cil,vol,precio,ha,nuevo:!!nuevo,
    tipo_producto:/^agro/i.test(norm(o.tipo_producto))?"Agroquímico":/^fert/i.test(norm(o.tipo_producto))?"Fertilizante":(o.tipo_producto||""),s:norm(o.producto+" "+(o.ingrediente_activo||""))};
}

let ALL=[],TIPO="";
function cardHTML(p,i){
  const sin = p.ha<=0;
  const mx = p.base==="CIL"
    ? `<div><small>Dosis / cil</small><b>${fmt(p.cil,3)} L</b></div><div><small>Volumen</small><b>${fmt(p.vol,0)} L</b></div><div><small>Dosis / ha</small><b>${fmt(p.ha,2)} L</b></div>`
    : `<div><small>Dosis / ha</small><b>${sin?"—":fmt(p.ha,2)+" L"}</b></div><div><small>Volumen</small><b>${fmt(p.vol,0)} L</b></div><div><small>Precio / L</small><b>${money(p.precio)}</b></div>`;
  return `<button class="card" data-i="${i}">
   <div class="badge"><i>${esc(p.tipo_producto||"Producto")}</i><i>${p.base==="CIL"?"Dosis por cilindro":"Dosis por ha"}</i>${p.nuevo?'<i class="new">Nuevo</i>':""}</div>
   <h3>${esc(p.producto)}</h3><div class="ia">${p.ingrediente_activo?esc(p.ingrediente_activo):"Ingrediente activo no registrado"}</div>
   <div class="mx">${mx}</div>
   <div class="cost"><small>Costo / ha</small><b>${sin?"Sin dosis":money(p.ha*p.precio)}</b></div></button>`;
}
function render(){
  const words=norm($("q").value).split(/\s+/).filter(Boolean), t0=norm($("q").value);
  const list=ALL.map((p,i)=>({p,i})).filter(({p})=>(!TIPO||p.tipo_producto===TIPO)&&words.every(w=>p.s.includes(w)))
    .sort((a,b)=>(norm(a.p.producto).startsWith(t0)?0:1)-(norm(b.p.producto).startsWith(t0)?0:1));
  $("grid").innerHTML=list.length?list.map(({p,i})=>cardHTML(p,i)).join(""):`<div class="empty">No hay productos para “${esc($("q").value)}”. Prueba con otro nombre o con el ingrediente activo.</div>`;
  $("count").textContent=list.length+" de "+ALL.length+" productos";
}
$("q").addEventListener("input",render);
$("chips").addEventListener("click",e=>{const b=e.target.closest(".chip");if(!b)return;TIPO=b.dataset.t;
  document.querySelectorAll(".chip").forEach(c=>c.setAttribute("aria-pressed",c===b));render()});

const X='<button class="x" aria-label="Cerrar" onclick="dlg.close()">×</button>';

   <div class="inp">

  const sd=$("sd"),sv=$("sv"),upd=()=>{const h=haDe(num(sd.value),num(sv.value));$("rh").textContent=fmt(h,2)+" L";$("rc").textContent=money(h*p.precio)};

  <div class="err" id="er"></div>
  <div class="acts"><button class="btn ghost" onclick="dlg.close()">Cancelar</button><button class="btn" id="sv2">Guardar producto</button></div>`;
  const f=["nd","nv","np"].map($),upd=()=>{const h=haDe(num(f[0].value),num(f[1].value));
    $("rh").textContent=h>0?fmt(h,2)+" L":"—";$("rc").textContent=h>0&&num(f[2].value)>0?money(h*num(f[2].value)):"—"};
  f.forEach(i=>i.oninput=upd);upd();
  $("sv2").onclick=guardar;dlg.showModal();$("nn").focus();
};
async function guardar(){
  const d={producto:$("nn").value.trim(),ingrediente_activo:$("ni").value.trim(),tipo_producto:$("nt").value,
    dosis_cil:num($("nd").value),volumen:num($("nv").value),precio_litro:num($("np").value)};
  if(!d.producto||d.dosis_cil<=0||d.volumen<=0||d.precio_litro<=0){$("er").textContent="Completa nombre, dosis / cil, volumen y precio por litro con valores mayores a 0.";return}
  if(ALL.some(p=>norm(p.producto)===norm(d.producto))){$("er").textContent="Ya existe un producto con ese nombre.";return}
  $("sv2").disabled=true;let guardado=false;
  if(APPS_SCRIPT_URL){
    try{await fetch(APPS_SCRIPT_URL,{method:"POST",mode:"no-cors",headers:{"Content-Type":"text/plain"},body:JSON.stringify(d)});guardado=true}
    catch(e){$("er").textContent="No se pudo guardar en Google Sheets. Revisa tu conexión e inténtalo de nuevo.";$("sv2").disabled=false;return}
  }
  ALL.unshift(build(d,true));render();dlg.close();
  $("aviso").innerHTML=`<div class="msg ${guardado?"ok":""}">${guardado?`“${esc(d.producto)}” se guardó en Google Sheets.`:`“${esc(d.producto)}” se agregó solo en esta sesión. Configura APPS_SCRIPT_URL para guardarlo en Google Sheets.`}</div>`;
}

/* ====== Carga de datos ====== */
async function init(){
  let data=FALLBACK,aviso="";
  if(SHEET_CSV_URL){
    try{const r=await fetch(SHEET_CSV_URL+(SHEET_CSV_URL.includes("?")?"&":"?")+"t="+Date.now());if(!r.ok)throw 0;
      data=toObjects(parseCSV(await r.text()));
      $("upd").textContent="Actualizado: "+new Date().toLocaleString("es-PE",{dateStyle:"short",timeStyle:"short"});
    }catch(e){aviso="No se pudo leer Google Sheets. Se muestran los datos guardados en el sitio. Revisa que la hoja esté publicada en la web como CSV."}
  }else aviso="Mostrando los datos incluidos en el sitio. Pega el enlace CSV de Google Sheets en SHEET_CSV_URL para usar tu hoja.";
  if(aviso)$("aviso").innerHTML=`<div class="msg">${aviso}</div>`;
  ALL=data.filter(o=>o.producto&&(o.activo||"SI").toUpperCase()!=="NO").map(o=>build(o));
  render();
}
init();
</script>
</body>
